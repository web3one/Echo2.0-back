# HD 钱包配置（充值地址派生用）
# 生产环境强烈建议用环境变量 WALLET_MNEMONIC 覆盖
# 也可以在 application-secret.yml 里覆盖（已 gitignore）
wallet:
  mnemonic: ${WALLET_MNEMONIC:PLEASE_SET_WALLET_MNEMONIC_VIA_ENV_OR_SECRET_YML}
  passphrase: ${WALLET_PASSPHRASE:}

# 加密币行情数据源开关
# 国内云服务器到 Binance 通常被屏蔽（HTTP 451），默认 binance.enabled=false 改走 Gate
# 海外服务器或代理出站环境可设 BINANCE_WS_ENABLED=true 启用 Binance
crypto:
  binance:
    enabled: ${BINANCE_WS_ENABLED:false}
  gate-spot:
    enabled: ${GATE_SPOT_WS_ENABLED:true}
